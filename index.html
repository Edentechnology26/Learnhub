<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css">
    <title>Login - LearnHub</title></head>
<body>
  <div class="login-container">
    <div class="card login-box">
      <h2 class="logo">LearnHub</h2>
      <h3>Welcome Back!</h3>
      <p>Continue your learning journey</p>
      <input type="email" placeholder="Email">
      <input type="password" placeholder="Password">
      <div style="display:flex; justify-content:space-between; margin:10px 0;">
        <label><input type="checkbox" style="width:auto;"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <a href="home.html" class="btn" style="width:100%; text-align:center;">Login</a>
      <p style="margin-top:15px; text-align:center;">Don't have account? <a href="#">Create account</a></p>
    </div>
  </div>
</body>
</html>
